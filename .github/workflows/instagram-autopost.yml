name: Instagram Autopost

on:
  schedule:
    - cron: "45 12 * * *"   # 8:45 AM ET
    - cron: "15 16 * * *"   # 12:15 PM ET
    - cron: "30 22 * * *"   # 6:30 PM ET
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Post today's scheduled entry (if any)
        env:
          IG_USER_ID: "39806415472279044"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 post_today.py
