name: Refill content bank

on:
  schedule:
    # Every Sunday at 11:00 UTC (7 AM ET during daylight time, 6 AM ET otherwise).
    - cron: "0 11 * * 0"
  workflow_dispatch: {}       # run it by hand from the Actions tab any time

# Share the autopost workflow's lock so the two never push to main at the same moment.
concurrency:
  group: instagram-autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - name: Write, render, and schedule the next batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/refill.py
      - name: Commit new posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.json bank/
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Refill content bank"
            git pull --rebase origin main
            git push
          fi
